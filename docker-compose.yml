services:
  sara-core:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sara_cerberusops
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - SARA_DB_PATH=/app/sara_soar.db
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
      - n8n
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: sara_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/workflows
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: sara_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  n8n_data:
  ollama_data:
